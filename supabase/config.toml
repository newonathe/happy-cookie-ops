# Local development only. Production settings live in the Supabase dashboard.
project_id = "happy-cookie-ops"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 1800               # docs/RUNBOOK-accounts.md; set the same value on the hosted project's dashboard
enable_signup = false          # staff accounts are created by the owner, not self-served

[auth.email]
# This is the email/password PROVIDER switch, not "allow self-serve signup" — that is the
# top-level auth.enable_signup above (GOTRUE_DISABLE_SIGNUP), which stays false. Setting
# this to false as well turns off email/password sign-IN entirely (422 email_provider_disabled),
# which is not what "signup disabled" means for a staff app where the owner still creates
# accounts and everyone signs in with a password.
enable_signup = true
enable_confirmations = false
