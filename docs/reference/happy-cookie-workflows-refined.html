function home(){const unknown=items.filter(i=>i.qty===null).length;return title('Good afternoon, Cine.','Saturday, 31 October')+`<section class="hc-hero"><div class="hc-row"><span class="hc-pill ${s.dayOpen?'':'neutral'}">${s.dayOpen?'Selling today':s.finalized?'Event finalized':'Day '+s.day+' closed'}</span><small>Bazaar</small></div><h2>${E(s.eventName)}</h2><p>${s.dayOpen?dayReceipts().length+' sales · '+money(dayRevenue())+' · Day '+s.day+' of 2':s.finalized?'Sales and event expenses are in your books.':'Continue with the next day or review the event.'}</p>${btn(s.dayOpen?'Continue selling '+ic('arrow-right'):s.finalized?'View event':'Prepare next day',s.dayOpen?'go:till':s.finalized?'go:bazaar':'go:plan','primary')}</section><div class="hc-section"><h2>What would you like to do?</h2></div><div class="hc-quick-grid">${[['shopping-bag','Orders',s.orderStatus==='Collected'?'No open orders':s.orderStatus==='Paid'?'1 to prepare':'1 ready for pickup','go:sell'],['cooking-pot','Start production','Record cookies made','start-production'],['package-plus','Receive delivery','Ingredients & packaging','go:receive'],['clipboard-list','Count stock','Enter a physical count','start-count'],['book-open','Products & recipes','6 flavours','go:make'],['shopping-basket','Shopping list','Grouped by supplier','go:shopping']].map(([icon,n,sub,a])=>`<button type="button" class="hc-quick cursor-interaction" data-action="${a}">${ic(icon)}<span>${n}<small>${sub}</small></span></button>`).join('')}</div>${s.receiveDirty||s.countDirty||Object.keys(recipeDrafts).length||Object.keys(productDrafts).length?`<div class="hc-section"><h2>Continue unfinished work</h2></div><section class="hc-panel">${s.receiveDirty?task('Delivery','Your entered items are kept.','Continue','go:receive'):''}${s.countDirty?task('Stock count','Your measured quantities are kept.','Continue','go:count'):''}${Object.entries(recipeDrafts).map(([id,d])=>task('Recipe changes',P(id).name,'Continue','resume-recipe:'+id)).join( function make(){return title('Products','Recipes and cookies made, together.',btn('Start production','start-production','primary')+gear('make-settings'))+makeTabs()+`<div class="hc-grid">${products.filter(p=>p.menu||s.showInactive).map(p=>`<article class="hc-product"><button type="button" class="hc-photo cursor-interaction" data-action="recipe:${p.id}" aria-label="View ${E(p.name)} recipe"><img src="${assets[p.photo]}" alt="${E(p.name)}"></button><div class="hc-product-body"><h3>${E(p.name)}</h3><div class="hc-row"><strong>${money(p.price)}</strong>${p.badge?`<span class="hc-pill neutral">${E(p.badge)}</span>`:''}</div><small>${s.finished[p.id]} baked cookies in stock</small></div><div class="hc-product-footer">${btn('Recipe','recipe:'+p.id,'quiet')}${btn('Edit product','edit-product:'+p.id,'quiet')}</div></article>`).join('')}</div>`;}
function recipeShortages(r){return [...r.ingredients.map(l=>({i:I(l.id),need:l.q*s.scale/r.yield})),...r.packaging.map(l=>({i:I(l.id),need:l.q*s.scale}))].filter(({i,need})=>i.qty===null||i.qty<need);}
function recipe(){const p=P(s.recipeId),r=R(),c=cost(r);return `<div class="hc-recipe-head"><img src="${assets[p.photo]}" alt="${E(p.name)}"><div><h1>${E(p.name)}</h1><p>Sample recipe · Version ${r.version}${r===recipes[p.id].at(-1)?' · Current':''} · Makes ${r.yield} cookies</p></div></div><div class="hc-row" style="margin-bottom:14px"><div class="hc-tabs" style="margin-bottom:0">${[['recipe','Recipe'],['cost','Cost'],['history','History']].map(([id,n])=>`<button type="button" class="cursor-interaction" data-action="recipe-tab:${id}" aria-pressed="${s.recipeTab===id}">${n}</button>`).join('')}</div>${btn(r===recipes[p.id].at(-1)?'Edit recipe':'Edit current recipe','edit-recipe')}</div>`+(s.recipeTab==='recipe'?`<div class="hc-columns"><section class="hc-panel"><div class="hc-row"><h2>Ingredients</h2><label class="hc-field" style="max-width:140px">Cookies to make<input type="number" min="1" step="1" data-field="scale" value="${s.scale}"></label></div><ul class="hc-recipe-lines">${r.ingredients.map(l=>`<li><label><input type="checkbox" data-recipe-check="${recipeCheckKey('ingredient',l.id)}" ${recipeChecks[recipeCheckKey('ingredient',l.id)]?'checked':''}>${E(I(l.id).name)}</label><strong>${fmt(l.q*s.scale/r.yield)} ${I(l.id).unit}</strong></li>`).join('')}</ul><div class="hc-section"><h2>Packaging</h2></div><ul class="hc-recipe-lines">${r.packaging.map(l=>`<li><label><input type="checkbox" data-recipe-check="${recipeCheckKey('packaging',l.id)}" ${recipeChecks[recipeCheckKey('packaging',l.id)]?'checked':''}>${E(I(l.id).name)}</label><strong>${fmt(l.q*s.scale)} ${I(l.id).unit}</strong></li>`).join('')}</ul><div class="hc-footer"><small>Saved yield: ${r.yield} cookies</small>${btn(r===recipes[p.id].at(-1)?'Start production':'Start with current recipe','start-production:'+p.id,'primary')}</div></section><section class="hc-panel"><h2>Stock for this batch</h2>${recipeShortages(r).map(({i,need})=>task(i.name,i.qty===null?'Not counted':'Need '+fmt(need)+' '+i.unit+' · have '+fmt(i.qty),i.qty===null?'Count':'Receive',i.qty===null?'count-one:'+i.id:'receive-one:'+i.id)).join('')||'<p class="hc-muted">Recorded ingredients cover this batch.</p>'}</section></div>`:s.recipeTab==='cost'?`<section class="hc-panel"><h2>Recipe cost</h2>${c===null?'<div class="hc-banner"><strong>Cost incomplete.</strong> Cream cheese has no recorded price.</div>'+btn('Open cream cheese','item:cream'):summary([['Ingredients per cookie',money(c-r.packaging.reduce((n,l)=>n+l.q*I(l.id).price/I(l.id).pack,0))],['Packaging per cookie',money(r.packaging.reduce((n,l)=>n+l.q*I(l.id).price/I(l.id).pack,0))],['Total cost per cookie',money(c),'','hc-total'],['Menu price',money(p.price)]])}</section>`:`<section class="hc-panel"><h2>Recipe versions</h2>${recipes[p.id].slice().reverse().map(v=>`<div class="hc-version"><div class="hc-row"><strong>Version ${v.version} · ${v.yield} cookies</strong>${btn('Read version','version:'+v.version,'quiet')}</div><small>${E(v.note)}</small></div>`).join('')}</section>`);}
function editRecipe(){const d=s.recipeDraft,p=P(s.recipeId);return title('Edit '+p.name,'Save changes as a new recipe version.')+`<section class="hc-panel">${input('Cookies per batch','recipeDraft.yield',d.yield,'number','min="1" step="1"')}<div class="hc-section"><h2>Ingredients</h2></div>${d.ingredients.map((l,i)=>`<div class="hc-count-row"><span>${E(I(l.id).name)}</span>${input(I(l.id).unit,'recipeDraft.ingredients.'+i+'.q',l.q,'number','min="0" step="0.1" aria-label="'+E(I(l.id).name)+' recipe amount"')}</div>`).join('')}<div class="hc-section"><h2>Packaging per cookie</h2></div>${d.packaging.map((l,i)=>`<div class="hc-count-row"><span>${E(I(l.id).name)}</span>${input('pcs','recipeDraft.packaging.'+i+'.q',l.q,'number','min="0" step="1" aria-label="'+E(I(l.id).name)+' per cookie"')}</div>`).join('')}${error()}${footer('Back to recipe','go:recipe','Review recipe changes','review-recipe')}</section>`;}
function recipeReview(){const d=s.recipeDraft,old=recipes[s.recipeId].at(-1);return title('Review recipe changes',P(s.recipeId).name)+`<section class="hc-panel">${summary([['New version',String(old.version+1)],['Batch yield',fmt(Number(d.yield))+' cookies',old.yield+' previously'],...d.ingredients.filter((l,i)=>Number(l.q)!==old.ingredients[i].q).map(l=>[I(l.id).name,fmt(Number(l.q))+' '+I(l.id).unit]),...d.packaging.filter((l,i)=>Number(l.q)!==old.packaging[i].q).map(l=>[I(l.id).name,fmt(Number(l.q))+' pcs per cookie'])])}<div class="hc-banner" style="margin-top:16px">Earlier production records keep their recipe version.</div>${error()}${footer('Change recipe','go:recipe-edit','Save new version','save-recipe')}</section>`;}
function editProduct(){const d=s.productDraft;return title('Edit product','Name, menu price and shop display.')+`<section class="hc-panel"><div class="hc-fields">${input('Product name','productDraft.name',d.name,'text')}${input('Menu price (₱)','productDraft.price',d.price,'number','min="0" step="0.01"')}</div><div class="hc-inline-label" style="margin:16px 0 6px">Badge ${info('Badge','A small label beside the cookie in your shop, such as Popular or Seasonal. Leave blank for no badge.')}</div>${input('Badge text','productDraft.badge',d.badge,'text','placeholder="Optional"')}${toggle('Show on menu','productDraft.menu',d.menu,'On includes this product in your shop menu. Existing bazaar prices stay unchanged.')}<p class="hc-muted" style="margin-top:12px">Active bazaar prices are set in its day plan.</p>${error()}${footer('Back to products','go:make','Save product','save-product')}</section>`;}
function production(){return title('Production','See what you made and what is ready.',btn('Start production','start-production','primary')+gear('make-settings'))+makeTabs()+`<section class="hc-panel"><h2>Cookies made</h2>${s.batches.length?s.batches.slice().reverse().map(b=>`<div class="hc-task"><div><h3>${E(P(b.product).name)}</h3><small>Version ${b.version} · ${E(b.source)}${b.note?' · '+E(b.note):''}</small></div><strong>${b.made} cookies made</strong></div>`).join(''):'<p class="hc-empty">No production recorded today.</p>'}</section><div class="hc-section"><h2>Baked stock</h2></div><section class="hc-panel">${products.map(p=>`<div class="hc-stock-row"><span>${E(p.name)}</span><strong>${s.finished[p.id]} cookies</strong></div>`).join('')}</section>`;}
function productionEntry(){const d=s.production,p=P(d.product),r=recipes[p.id].at(-1);return title('Record production','Record the cookies actually made.')+`<section class="hc-panel"><div class="hc-fields">${select('Product','production.product',d.product,products.map(p=>[p.id,p.name]))}${input('Cookies made','production.made',d.made,'number','min="1" step="1" placeholder="Actual finished cookies"')}${select('Made from','production.source',d.source,['Ingredients','Portioned dough'])}${input('Recipe version','productionVersion','Version '+r.version,'text','readonly')}</div><div style="margin-top:14px">${input('Batch note','production.note',d.note,'text','placeholder="Optional"')}</div>${error()}${footer('Back to production','go:production','Review production','review-production')}</section>`;}
function productionReview(){const d=s.production,r=recipes[d.product].at(-1);return title('Review production',P(d.product).name)+`<section class="hc-panel">${summary([['Cookies made',fmt(Number(d.made))+' cookies'],['Recipe version',String(r.version)],['Made from',E(d.source)],['Baked stock after recording',fmt(s.finished[d.product]+Number(d.made))+' cookies']])}<div class="hc-section"><h2>${d.source==='Portioned dough'?'Dough used':'Ingredient use'}</h2></div>${summary(d.source==='Portioned dough'?[[P(d.product).name,fmt(Number(d.made))+' portions']]:r.ingredients.map(l=>[I(l.id).name,fmt(l.q*Number(d.made)/r.yield)+' '+I(l.id).unit,I(l.id).qty===null?'Starting balance unknown':'']))}<div class="hc-section"><h2>Packaging used</h2></div>${summary(r.packaging.map(l=>[I(l.id).name,fmt(l.q*Number(d.made))+' pcs',I(l.id).qty===null?'Starting balance unknown':'']))}${error()}${footer('Change production','go:production-entry','Record production','save-production')}</section>`;}
function stock(){const list=items.filter(i=>i.category===s.category);return title('Inventory','Ingredients, packaging, dough and baked cookies.',(['Dough','Baked stock'].includes(s.category)?btn('Start production','start-production','primary'):btn('Add to inventory','go:new-item','primary'))+gear('stock-settings'))+stockTabs()+`<div class="hc-actions" style="margin-bottom:16px">${['Dough','Baked stock'].includes(s.category)?'':btn('Receive delivery','go:receive')}${btn('Count stock','start-count')}</div><div class="hc-tabs categories">${['Ingredients','Packaging','Dough','Baked stock'].map(c=>`<button type="button" class="cursor-interaction" data-action="category:${c}" aria-pressed="${s.category===c}">${c}</button>`).join('')}</div>${['Dough','Baked stock'].includes(s.category)?`<section class="hc-panel">${products.map(p=>`<div class="hc-task"><div><h3>${E(p.name)}</h3><small>${s.category==='Dough'?s.dough[p.id]+' portions · ready to bake':s.finished[p.id]+' baked cookies · kitchen stock'}</small></div>${s.category==='Dough'?btn('Bake','bake-dough:'+p.id,'',s.dough[p.id]?'':'disabled'):btn('Recipe','recipe:'+p.id)}</div>`).join('')}</section>`:`<section class="hc-panel" id="hc-stock-list">${list.map(i=>`<div class="hc-stock-row"><button type="button" class="hc-item-link cursor-interaction" data-action="item:${i.id}"><strong>${E(i.name)}</strong><small>${fmt(i.pack)} ${i.unit} per pack${i.price===null?' · price missing':''}</small></button><div class="hc-stock-amount">${i.qty===null?'Unknown':fmt(i.qty)+' '+i.unit}<small><span class="hc-pill ${status(i)==='In stock'?'neutral':'warn'}">${status(i)}</span></small></div></div>`).join('')}</section>`}`;}
function item(){const i=I(s.itemId),moves=s.movements.filter(m=>m.item===i.id).slice().reverse();return title(i.name,'Inventory · '+i.category,btn('Edit item','edit-item:'+i.id))+`<section class="hc-panel"><div class="hc-row"><div><span class="hc-pill ${status(i)==='In stock'?'neutral':'warn'}">${status(i)}</span><h2 style="margin-top:12px;font-size:28px">${i.qty===null?'Not counted':fmt(i.qty)+' '+i.unit}</h2></div><div class="hc-actions">${btn('Receive','receive-one:'+i.id,'primary')}${btn('Count','count-one:'+i.id)}${btn('Waste / correction','go:adjust')}</div></div>${summary([['Pack size',fmt(i.pack)+' '+i.unit],['Pack price',i.price===null?'Not recorded':money(i.price)],['Supplier',E(suppliers.find(x=>x.id===i.supplier)?.name||'Not set')]])}</section><div class="hc-section"><h2>Stock history</h2></div><section class="hc-panel">${moves.length?moves.map(m=>`<div class="hc-task"><div><h3>${E(m.label)}</h3><small>${E(m.note||'Today · sample record')}</small></div><strong>${m.amount===null?'Unknown':fmt(m.amount)+' '+i.unit}</strong></div>`).join(''):'<p class="hc-muted">No changes recorded in this preview.</p>'}</section>`;}
function editItem(){const d=s.itemDraft;return title('Edit item details',d.name)+`<section class="hc-panel"><div class="hc-fields">${input('Item name','itemDraft.name',d.name,'text')}${input('Stock unit','itemDraft.unit',d.unit,'text','readonly')}${input('Quantity per pack','itemDraft.pack',d.pack,'number','min="0" step="0.1"')}${input('Pack price (₱)','itemDraft.price',d.price??'','number','min="0" step="0.01" placeholder="Not recorded"')}${input('Reorder level','itemDraft.low',d.low,'number','min="0" step="0.1"')}${select('Supplier','itemDraft.supplier',d.supplier,suppliers.map(x=>[x.id,x.name]))}</div><p class="hc-muted" style="margin-top:14px">The pack price updates recipe estimates.</p>${error()}${footer('Back to item','go:item','Save item details','save-item')}</section>`;}
function receive(){return title('Receive delivery','Enter what arrived, not what was ordered.')+`<section class="hc-panel"><div class="hc-fields">${select('Supplier','receive.supplier',s.receive.supplier,suppliers.map(x=>[x.id,x.name]))}${input('Delivery date','receive.date',s.receive.date,'date')}</div><hr class="hc-subtle-line"><div id="hc-delivery-lines">${s.receive.lines.map((l,k)=>`<div class="hc-delivery-line"><div class="hc-row" style="align-items:flex-end"><div style="flex:1;min-width:130px">${select('Item','receive.lines.'+k+'.item',l.item,items.map(i=>[i.id,i.name]))}</div>${s.receive.lines.length>1?btn('Remove','remove-line:'+k,'quiet'):''}</div><div class="hc-fields three">${input('Packs received','receive.lines.'+k+'.packs',l.packs,'number','min="0" step="0.01"')}${input('Per pack ('+I(l.item).unit+')','receive.lines.'+k+'.size',l.size,'number','min="0" step="0.1"')}${input('Total paid (₱)','receive.lines.'+k+'.paid',l.paid,'number','min="0" step="0.01"')}</div><p class="hc-conversion" data-conversion="${k}">${conversion(l)}</p></div>`).join('')}</div><div style="margin-top:14px">${btn('Add another item','add-line')}</div>${error()}${footer('Back to inventory','go:stock','Review delivery','review-receive')}</section>`;}

function receiveReview(){return title('Review delivery',suppliers.find(x=>x.id===s.receive.supplier).name+' · '+s.receive.date)+`<section class="hc-panel">${summary(s.receiveReview.map(l=>[I(l.item).name,fmt(l.qty)+' '+I(l.item).unit+' received',l.before===null?'After receipt: unknown · opening count needed':'After receipt: '+fmt(l.before+l.qty)+' '+I(l.item).unit]))}${summary([['Total paid',money(s.receiveReview.reduce((n,l)=>n+l.paid,0)),'','hc-total']])}${error()}${footer('Change delivery','go:receive','Record delivery','save-receive')}</section>`;}
function newItem(){const d=s.newItem;return title('Add to inventory','Create an ingredient or packaging item.')+`<section class="hc-panel"><div class="hc-fields">${input('Item name','newItem.name',d.name,'text')}${select('Category','newItem.category',d.category,['Ingredients','Packaging'])}${select('Stock unit','newItem.unit',d.unit,['g','ml','pcs'])}${input('Starting quantity (optional)','newItem.qty',d.qty,'number','min="0" step="0.1" placeholder="Blank = not counted"')}${input('Quantity per pack','newItem.pack',d.pack,'number','min="0" step="0.1"')}${input('Pack price (optional, ₱)','newItem.price',d.price,'number','min="0" step="0.01"')}${select('Supplier','newItem.supplier',d.supplier,suppliers.map(x=>[x.id,x.name]))}</div>${error()}${footer('Back to inventory','go:stock','Add to inventory','save-new-item')}</section>`;}

function adjust(){const i=I(s.itemId);return title('Waste / correction',i.name)+`<section class="hc-panel"><div class="hc-fields">${select('Reason','adjust.reason',s.adjust.reason,[['','Choose a reason'],['Waste','Waste / damaged'],['Correction','Quantity correction']])}${input('Quantity removed ('+i.unit+')','adjust.amount',s.adjust.amount,'number','min="0" step="0.1"')}</div><div style="margin-top:14px">${input('Note','adjust.note',s.adjust.note,'text','placeholder="What happened?"')}</div>${error()}${footer('Back to item','go:item','Review change','review-adjust')}</section>`;}

function shopping(){const planned=[['flour',2000],['butter',1000],['spread',200]],rows=planned.map(([id,need])=>({i:I(id),need})).filter(({i,need})=>i.qty!==null&&need>i.qty);return title('Shopping','Buy what is short for the planned bake.',gear('stock-settings'))+stockTabs()+`<section class="hc-panel"><h2>Bake Supply</h2>${rows.length?rows.map(({i,need})=>{const packs=Math.ceil((need-i.qty)/i.pack);return `<div class="hc-stock-row"><div><strong>${E(i.name)}</strong><small>Need ${fmt(need)} ${i.unit} · have ${fmt(i.qty)} ${i.unit}</small><small>Buy ${packs} × ${fmt(i.pack)} ${i.unit}</small></div><strong>${money(packs*i.price)}</strong></div>`;}).join(''):'<p class="hc-empty">Recorded stock covers the planned ingredients.</p>'}<div class="hc-footer">${btn('View supplier','supplier:bake')}${btn('Receive delivery','go:receive','primary')}</div></section>${items.some(i=>i.qty===null)?`<div class="hc-section"><h2>Count before buying</h2></div><section class="hc-panel">${items.filter(i=>i.qty===null).map(i=>task(i.name,'Starting quantity unknown','Count','count-one:'+i.id)).join('')}</section>`:''}`;}

function plannedNeeds(){
  const needs=new Map();
  for(const b of g.plannedBakes){const r=recipes[b.product]?.at(-1),qty=Number(b.qty);if(!r||!qty)continue;
    for(const line of r.ingredients)needs.set(line.id,(needs.get(line.id)||0)+line.q*qty/r.yield);
    for(const line of r.packaging)needs.set(line.id,(needs.get(line.id)||0)+line.q*qty);
  }
  return [...needs].map(([id,need])=>({item:I(id),need}));
}
function quotesFor(item){const quotes=g.quotes.filter(q=>q.item===item.id&&suppliers.some(s=>s.id===q.supplier));
  if(!quotes.some(q=>q.supplier===item.supplier))quotes.push({item:item.id,supplier:item.supplier,pack:item.pack,price:item.price});
  return quotes.sort((a,b)=>(a.price===null?Infinity:a.price/a.pack)-(b.price===null?Infinity:b.price/b.pack));
}
function purchaseRows(){return plannedNeeds().filter(x=>x.item.qty!==null&&x.need>x.item.qty).map(x=>{const quotes=quotesFor(x.item),q=quotes.find(q=>q.supplier===(g.buyFrom[x.item.id]||x.item.supplier))||quotes[0];const packs=Math.ceil((x.need-x.item.qty)/q.pack);return {...x,q,packs,total:q.price===null?null:packs*q.price};});}

const mutationActions=new Set(['save-sale','confirm-void','save-close','open-table','finalize','save-bazaar-settings','save-rules','save-boxes','save-recipe','save-product','save-item','save-receive','save-count','save-new-item','save-adjust','save-supplier','save-production','g-event-save','g-tool-save','g-money-save','g-payment-confirm','g-payment-reject','g-order-confirm','g-public-place','g-method-save','g-text-save','g-schedule-save','g-product-save','g-cost-save','g-cost-clear','g-person-save','g-contact-remove','g-restore-apply']);

function simulateSave(a,id,extra){
  if(!mutationActions.has(a))return false;
  if((g.role==='Helper'||g.mode==='Helper access')&&['save-product','save-item','save-boxes','save-rules','save-supplier','save-new-item','g-money-save','g-person-save','g-cost-save','g-cost-clear','g-event-save','g-method-save','g-text-save','g-schedule-save','save-bazaar-settings','g-product-save','g-book-rules-save','g-quote-save'].includes(a)){fail('Only an owner can change this. Your entry is kept.');return true;}
  if(readonlyDevice()&&['save-sale','confirm-void','save-close','open-table','finalize','g-tool-save'].includes(a)){go('device-recovery');return true;}
  if(g.mode==='Save unavailable'||g.mode==='Edited elsewhere'||s.offline&&!['save-sale','confirm-void'].includes(a)){
    g.retry={a,id,extra,page:s.page};g.conflict=g.mode==='Edited elsewhere';render();persist();return true;
  }
  if(g.mode==='Confirmation delayed'&&!g.acknowledgement){g.acknowledgement={a,id,extra,page:s.page,ready:false};g.mode='Normal';return false;}
  return false;
}

async function gapAction(a,id,extra){
  if(a==='g-read-retry'){g.mode='Normal';render();return;}
  if(a==='g-classic'){g.classic=true;go('classic-till');return;}
  if(a==='g-card-till'){g.classic=false;go('till');return;}
  if(a==='g-classic-next'){s.cart={};s.payment=false;s.mobileSale=false;s.tender='';s.walletConfirmed=false;go('classic-till');return;}
  if(a==='g-book-rules-save'){if([g.bookRules.tax,g.bookRules.margin].some(v=>v!==''&&(!validNumber(v)||Number(v)>100)))return fail('Use percentages from 0 to 100, or leave an unset value blank.');go('money-settings');return;}
  if(a==='g-reset'){g.resetReturn=s.page;go('reset-preview');return;}
  if(a==='g-reset-confirm'){window.parent.postMessage({type:'hc-preview-reset'},'*');return;}
  if(a==='g-event-new'){g.eventDraft={id:null,name:'',start:today,end:today,place:'',target:'',archived:false};go('event-edit');return;}
  if(a==='g-event-edit'){g.eventDraft=clone(g.events.find(x=>x.id===id));go('event-edit');return;}
  if(a==='g-event'){switchEvent(id);return;}
